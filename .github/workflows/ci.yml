name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into Node 24 for all JavaScript actions so the Jun-2026 deprecation
  # notices stop polluting the log of every job.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: utf-8
  # Silence UV telemetry and keep cache location explicit.
  UV_NO_SYNC: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        run: uv pip install --system "ruff>=0.6"

      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (${{ matrix.os }} · Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Linux runs all supported Python versions for compat coverage; Windows
      # only runs the primary version (3.11) since Windows-specific issues
      # (paths, encoding, line endings) surface on any Python version. Trims
      # 6 cells -> 4, saving ~2 cells of GHA compute per push.
      matrix:
        include:
          - { os: ubuntu-latest, python-version: '3.10' }
          - { os: ubuntu-latest, python-version: '3.11' }
          - { os: ubuntu-latest, python-version: '3.12' }
          - { os: windows-latest, python-version: '3.11' }
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg (cross-platform, cached)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install torch (CPU) + project + dev extras
        shell: bash
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e ".[dev]"

      - name: Run unit + smoke + fast integration tests
        shell: bash
        run: |
          # tests/integration includes mock-only flows (test_cli_main.py)
          # alongside real-model flows tagged ``slow``. ``-m "not slow"``
          # excludes the latter so CI doesn't try to download the ~3 GB
          # Breeze-ASR-26 weights on every push.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.python-version }}" = "3.11" ]; then
            # Primary cell: coverage + xml report for codecov upload.
            pytest tests/unit tests/smoke tests/integration -v -m "not slow" \
              --cov=taigi_asr --cov-report=xml
          else
            # Secondary cells: skip coverage overhead; we only upload from one cell.
            pytest tests/unit tests/smoke tests/integration -v -m "not slow"
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Skip the ~8 min image build on PRs that don't touch any of the inputs
      # to the Dockerfile (i.e. PRs that only change CI yaml, docs, or tests).
      # The job still runs and reports green so required-check status stays
      # consistent — only the heavy steps below are gated.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - 'src/**'
              - 'data/**'
              - 'examples/**'

      - name: Skip notice
        if: steps.changes.outputs.docker != 'true'
        run: echo "::notice::No Docker-relevant changes; skipping image build."

      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.docker == 'true'

      - name: Build image (no push) with GHA cache
        if: steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: taigi-asr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-import the built image
        # Ensures the image layers actually produce a working Python env,
        # not just that Docker build didn't error mid-stage.
        if: steps.changes.outputs.docker == 'true'
        run: |
          docker run --rm --entrypoint python taigi-asr:ci -c \
            "import taigi_asr; print('taigi-asr', taigi_asr.__version__, 'OK')"
