[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "breeze-asr-taigi"
version = "0.1.0"
description = "Taiwanese Hokkien (Taigi) speech-to-text transcriber - MediaTek Breeze-ASR-26 with faster-whisper, tuned for RTX 3050 4GB low-VRAM GPUs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "thc1006", email = "hctsai1006@cs.nctu.edu.tw" },
]
keywords = [
    "asr",
    "speech-recognition",
    "taiwanese",
    "hokkien",
    "taigi",
    "whisper",
    "faster-whisper",
    "breeze-asr",
    "rtx-3050",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # NOTE: `torch` is deliberately NOT listed here. Users must install the
    # correct CUDA/CPU wheel themselves from https://pytorch.org/ (or the
    # install.{sh,bat} / Dockerfile in this repo). Adding torch here would
    # pull the CPU wheel by default on `pip install`, silently defeating the
    # GPU optimisation this project is built for.
    "faster-whisper>=1.1.0",
    "soundfile>=0.12",
    "pydub>=0.25",
    "numpy>=1.24",
    "gradio>=4.44",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
# Users who explicitly want a CPU install can opt in with `pip install .[cpu-torch]`.
cpu-torch = ["torch>=2.1"]
hf = [
    "transformers>=4.40",
    "accelerate>=0.30",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
]
# Speaker diarization via pyannote/speaker-diarization-3.1.
# Pinned <4 because 4.0 requires torch>=2.8 and the project targets the
# CUDA 12.4 wheel of torch 2.6 for the RTX 3050 / 4 GB path.
# Requires HF_TOKEN + license acceptance for both speaker-diarization-3.1
# and segmentation-3.0; see README "講者分群" section for setup.
diarize = [
    "pyannote.audio>=3.1,<4",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/thc1006/breeze-asr-taigi"
Repository = "https://github.com/thc1006/breeze-asr-taigi"
Issues = "https://github.com/thc1006/breeze-asr-taigi/issues"

[project.scripts]
taigi-asr = "taigi_asr.cli:main"
taigi-asr-ui = "taigi_asr.ui.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taigi_asr"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "slow: integration tests that need GPU + model download",
    "gpu: require CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function call in argument defaults — Gradio gr.Progress idiom
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["src/taigi_asr"]
omit = [
    "src/taigi_asr/ui/*",  # UI tested via smoke only
    "src/taigi_asr/engines/huggingface.py",  # requires GPU
    "src/taigi_asr/engines/faster_whisper.py",  # requires GPU
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
